# Pipeline para rama develop - Pre-producción
# Genera tags basados en la versión del package.json con sufijo -develop
# Ejemplo: version 0.0.1 → tags: 0.0.1-develop, 0.0-develop, 0-develop

name: Development Build (develop)

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  IMAGE_NAME: central504-menu

jobs:
  cancel-previous-execution:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.11.0
        with:
          access_token: ${{ github.token }}

  build-and-push:
    runs-on: ubuntu-latest
    needs: cancel-previous-execution

    steps:
      - uses: actions/checkout@v4.2.1

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "full=$VERSION" >> $GITHUB_OUTPUT
          echo "major=$(echo $VERSION | cut -d. -f1)" >> $GITHUB_OUTPUT
          echo "major_minor=$(echo $VERSION | cut -d. -f1-2)" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
          echo "Tags: $VERSION-develop, $(echo $VERSION | cut -d. -f1-2)-develop, $(echo $VERSION | cut -d. -f1)-develop"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.full }}-develop
            ${{ secrets.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.major_minor }}-develop
            ${{ secrets.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.major }}-develop
          labels: |
            org.opencontainers.image.title=Central504 Management (Development)
            org.opencontainers.image.version=${{ steps.version.outputs.full }}-develop
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:buildcache-develop
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:buildcache-develop,mode=max
          build-args: |
            NODE_ENV=production
          platforms: linux/amd64

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4.2.1

      - name: Extract version for deployment
        id: deploy_version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "tag=$VERSION-develop" >> $GITHUB_OUTPUT

      - name: Deploy to Development Server
        uses: fjogeleit/http-request-action@v1.15.5
        with:
          url: ${{ secrets.PORTAINER_WEBHOOK_DEPLOY_DEV }}?tag=${{ steps.deploy_version.outputs.tag }}
          method: "POST"
          timeout: 10000
          ignoreSsl: true
