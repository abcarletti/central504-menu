# This is a basic workflow to help you get started with Actions

name: central504-menu-CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [master, develop]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  IMAGE_NAME: central504-menu

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  cancel-previous-execution:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions: write-all
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.11.0
        with:
          access_token: ${{ github.token }}

  # Utilizamos una estrategia de matriz para cachear los nodos de módulos
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix-key: ${{ steps.compute-matrix-key.outputs.key }}

    steps:
      - uses: actions/checkout@v4.2.1

      - name: Compute matrix key
        id: compute-matrix-key
        run: echo "key=$(date +'%Y-week-%V')" >> $GITHUB_OUTPUT

  # Construir y publicar la imagen de Docker
  build-and-push:
    runs-on: ubuntu-latest
    needs: [setup, cancel-previous-execution]

    steps:
      - uses: actions/checkout@v4.2.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            NODE_ENV=production

  # Despliegue en el servidor (solo para rama main)
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Server
        uses: fjogeleit/http-request-action@v1.15.5
        with:
          url: ${{ secrets.PORTAINER_WEBHOOK_DEPLOY }}
          method: 'POST'
          timeout: 10000
          ignoreSsl: true
