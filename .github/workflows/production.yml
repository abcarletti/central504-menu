# Pipeline para rama main - Producción
# Genera tags basados en la versión del package.json
# Ejemplo: version 0.0.1 → tags: 0.0.1, 0.0, 0, latest

name: Production Build (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: central504-menu

jobs:
  cancel-previous-execution:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.11.0
        with:
          access_token: ${{ github.token }}

  build-and-push:
    runs-on: ubuntu-latest
    needs: cancel-previous-execution

    steps:
      - uses: actions/checkout@v4.2.1

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "full=$VERSION" >> $GITHUB_OUTPUT
          echo "major=$(echo $VERSION | cut -d. -f1)" >> $GITHUB_OUTPUT
          echo "major_minor=$(echo $VERSION | cut -d. -f1-2)" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
          echo "Tags: $VERSION, $(echo $VERSION | cut -d. -f1-2), $(echo $VERSION | cut -d. -f1), latest"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.full }}
            ${{ secrets.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.major_minor }}
            ${{ secrets.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.major }}
            ${{ secrets.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=Central504 Management
            org.opencontainers.image.version=${{ steps.version.outputs.full }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            NODE_ENV=production
          platforms: linux/amd64

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4.2.1

      - name: Extract version for deployment
        id: deploy_version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Deploy to Production Server
        uses: fjogeleit/http-request-action@v1.15.5
        with:
          url: ${{ secrets.PORTAINER_WEBHOOK_DEPLOY }}?tag=${{ steps.deploy_version.outputs.tag }}
          method: "POST"
          timeout: 10000
          ignoreSsl: true
